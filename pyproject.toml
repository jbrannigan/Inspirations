[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspirations"
version = "0.1.0"
description = "Local-first inspiration library: ingest, classify, curate, annotate, export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.scripts]
inspirations = "inspirations.cli:main"

[tool.ruff.lint]
# Ruff 0.16 widened its default rule set; pin the long-standing defaults so an
# unpinned ruff upgrade (CI installs latest) can't change what lint enforces.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
